[package]
name = "rustymail-infrastructure"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
rustymail-domain = { path = "../rustymail-domain" }
rustymail-application = { path = "../rustymail-application" }
rustymail-modules = { path = "../rustymail-modules" }
rustymail-llm = { path = "../rustymail-llm" }
rustymail-semantic = { path = "../rustymail-semantic", features = ["embeddings-onnx"] }
whatlang = "0.18"
rusqlite = { version = "0.39.0", features = ["bundled-sqlcipher-vendored-openssl"] }
keyring = "4.0.0"
keyring-core = "1.0.0"
async-imap = { version = "0.11.2", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.5.0", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "fs", "sync", "time"] }
socket2 = "0.5"
futures = "0.3.31"
mailparse = "0.15.0"
serde = { workspace = true }
lettre = { version = "0.11.22", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-native-tls"] }
pulldown-cmark = "0.10.3"
mime_guess = "2.0.5"
dirs = "5.0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
unicode-normalization = "0.1"
utf7-imap = "0.3.2"
base64 = "0.22"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
url = "2"
log = "0.4"
ureq = { version = "2.9", default-features = false, features = ["tls"] }
quick-xml = { version = "0.37", features = ["serialize"] }
urlencoding = "2"
rand = "0.8"
open = "5"
regex = "1"

[dev-dependencies]
tempfile = "3"
