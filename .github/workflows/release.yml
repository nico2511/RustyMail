name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  verify:
    name: Verify (fmt · clippy · test · tsc · vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: System deps (OpenSSL + Tauri/GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: npm ci
        run: npm ci

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Vitest
        run: npm test

  build-windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read app version
        id: meta
        shell: pwsh
        run: |
          $json = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $ver = $json.version
          if (-not $ver) { throw "version missing in tauri.conf.json" }
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag=v$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Building RustyMail $ver (tag v$ver)"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Require updater signing key on tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY absent : release refusée avant la publication."
          }

      - name: Build Tauri (Windows)
        env:
          # Public desktop OAuth clients — embed at build so installers work offline of any RustyMail server.
          # Configure these as GitHub Actions repository secrets (optional; buttons disabled if absent).
          RUSTYMAIL_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.RUSTYMAIL_GOOGLE_OAUTH_CLIENT_ID }}
          RUSTYMAIL_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.RUSTYMAIL_GOOGLE_OAUTH_CLIENT_SECRET }}
          RUSTYMAIL_MICROSOFT_OAUTH_CLIENT_ID: ${{ secrets.RUSTYMAIL_MICROSOFT_OAUTH_CLIENT_ID }}
          # Clé privée minisign de l’updater. Absente → installeur NSIS quand même, sans .sig / latest.json.
          # Ne jamais committer cette clé. Voir docs/RELEASE.md.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Host "::warning::TAURI_SIGNING_PRIVATE_KEY absent — installeur NSIS sans artefacts updater (.sig / latest.json)."
            npm run tauri:build -- --bundles nsis
          } else {
            npm run tauri:build -- --bundles nsis --config src-tauri/tauri.updater.release.json
          }

      - name: Write updater latest.json
        shell: pwsh
        run: |
          $nsis = @('target/release/bundle/nsis', 'src-tauri/target/release/bundle/nsis') |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $nsis) { throw "dossier NSIS introuvable" }
          node scripts/write-updater-latest-json.mjs $nsis "$env:GITHUB_REPOSITORY"

      - name: List build outputs
        shell: pwsh
        run: |
          foreach ($root in @('target/release', 'src-tauri/target/release')) {
            if (Test-Path $root) {
              Write-Host "== $root =="
              Get-ChildItem -Recurse $root -Include *.exe,*.msi -ErrorAction SilentlyContinue |
                Select-Object -ExpandProperty FullName
            }
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: rustymail-windows
          path: |
            target/release/bundle/nsis/**
            target/release/rustymail.exe
            src-tauri/target/release/bundle/nsis/**
            src-tauri/target/release/rustymail.exe
          if-no-files-found: error

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Read app version
        id: meta
        shell: bash
        run: |
          ver=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed 's/.*"version": "\([^"]*\)".*/\1/')
          test -n "$ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          echo "Publishing release v$ver"

      - uses: actions/download-artifact@v6
        with:
          name: rustymail-windows
          path: dist

      - name: Verify artifacts
        run: |
          find dist -type f \( -name '*.exe' -o -name '*.msi' \) | head -20
          test "$(find dist -type f \( -name '*.exe' -o -name '*.msi' \) | wc -l)" -gt 0
          test -n "$(find dist -type f -name 'latest.json' | head -1)"
          test -n "$(find dist -type f -name '*.sig' | head -1)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: RustyMail ${{ steps.meta.outputs.version }}
          files: dist/**
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
