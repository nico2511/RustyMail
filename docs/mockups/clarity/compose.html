<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clarity v4 — Compose</title>
    <link rel="stylesheet" href="clarity.css" />
  </head>
  <body>
    <nav class="mock-nav">
      <a href="inbox.html">Inbox</a>
      <a href="thread.html">Fil</a>
      <a class="on" href="compose.html">Compose</a>
    </nav>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand"><strong>RustyMail</strong></div>
        <button type="button" class="nav-item active">Reçus</button>
      </aside>
      <header class="topbar">
        <a class="back" href="thread.html">← Fil</a>
        <span style="font-size: 13px; font-weight: 600; color: var(--text); margin-left: 8px">Réponse</span>
      </header>
      <main class="main">
        <div class="sheet" data-compose-sheet>
          <div class="compose-tabs" data-compose-tabs role="tablist">
            <button type="button" class="is-on" data-tab="edit" role="tab">Rédaction</button>
            <button type="button" data-tab="preview" role="tab">Aperçu</button>
          </div>
          <div class="row-field"><label>À</label><input type="text" value="marie@exemple.fr" readonly /></div>
          <div class="row-field"><label>Objet</label><input type="text" value="Re: Renouvellement hébergement" readonly /></div>
          <div class="body-field" contenteditable="true">
            Bonjour Marie,<br /><br />
            Oui pour 12 mois si le total reste à 129 € TTC.<br /><br />
            Merci,
          </div>
          <div class="preview-pane" aria-hidden="true">
            <p><strong>À:</strong> marie@exemple.fr</p>
            <p><strong>Objet:</strong> Re: Renouvellement hébergement</p>
            <hr style="border: 0; border-top: 1px solid var(--border-subtle); margin: 12px 0" />
            <p>Bonjour Marie,</p>
            <p>Oui pour 12 mois si le total reste à 129 € TTC.</p>
            <p>Merci,</p>
          </div>
          <div class="sheet-foot">
            <span class="hint">⌘↵ envoyer · onglet Aperçu avant envoi</span>
            <div>
              <button type="button" class="btn-ghost">Affiner</button>
              <button type="button" class="btn-primary">Envoyer</button>
            </div>
          </div>
        </div>
      </main>
      <footer class="statusbar"></footer>
    </div>
    <script src="mockup.js"></script>
  </body>
</html>
