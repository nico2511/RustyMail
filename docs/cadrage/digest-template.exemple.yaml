# ESQUISSE — non chargée par RustyMail.
# Contrat visé pour un template digest déclaratif (cas Deblock).
# Voir docs/CADRAGE_DIGEST_TEMPLATES.md. Ne pas committer de vrai mail ici.

id: deblock
rule_set_version: "1"

match:
  # Seul déclencheur de réécriture au MVP.
  confidence_required: strong
  sender_domains:
    - exact: deblock.com
    - suffix: .deblock.com
  # Indices pour la revue humaine et les tests négatifs.
  # Ils ne sélectionnent pas le template.
  authoring_hints:
    subject_contains:
      - deblock
    html_contains:
      - cdn1.deblock.com/
      - deblock.com/emails/

extract:
  root: div.f-fallback
  title:
    selector: h3
    index: 0
  emphasis:
    selector: div
    class_contains: code
  section_heading:
    selector: h3
    index: 1
    text_contains_any:
      - détails
      - details
      - "👇"
  rows:
    selector: p
    stop_when:
      class_contains: warning
      or_tag: h3
    label: "b, strong"
    value: after_br

render:
  kind: key_value
  details_heading: Détails

# Oracle humain, pas une sortie de modèle.
expect:
  marker: "rustymail:digest"
  contains:
    - "200 EUR"
    - IBAN
  absent:
    - "Marketing footer"

negative:
  - sender: ami@example.com
    subject: "mon virement deblock"
    expect_provider: generic
